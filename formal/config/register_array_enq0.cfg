# Proof config: register_array, ENQ_ENA=0 (replace-only build)
#
# Run from the REPO ROOT. Use formal/run.sh rather than invoking this directly.
#
# A SEPARATE RUN, NOT A VARIANT. Reset fills the array with all-ones while size
# resets to 0 (register_array.sv:56-62), so the queue boots physically full but
# logically empty and each replace evicts one placeholder. The reachable command
# set differs too: there is no enqueue datapath, so a bare write is not a
# command this build has.



# ---- 1. sources -------------------------------------------------------------
source              hwpq/register_array/src/register_array.sv
source              formal/spec/hwpq_spec.sv
source              formal/bind/register_array_bind.sv

# ---- 2. elaborate SMALL -----------------------------------------------------
# Same sizes as the ENQ_ENA=1 run; only the reset fill and the command set move.
top                 hwpq_rst_register_array
param               QUEUE_SIZE 4
param               DATA_WIDTH 3
param               ENQ_ENA 0

# ---- 3. time and reset ------------------------------------------------------
clock               i_CLK
reset               ~i_init_RSTn

# ---- 4. prove, gate, exit ---------------------------------------------------
module              register_array_enq0
allow_bounded       0

# ASSUME_FILL_FIRST in the spec constrains this build to the initialisation
# convention its callers follow (fill the queue before reading from it). The
# cover set is what proves the assumption did not strangle the design.
# Ungated runs must reproduce EXACTLY these and nothing else. If one stops
# firing the assumption should be retired; if a new one appears, something
# regressed. Either way the run fails and says which.
#   a_occ_empty_agrees, a_no_loss: without ASSUME_FILL_FIRST the replace-only
#   queue reports empty while still physically holding the payload, or holds
#   an element during the fill phase it will not admit to as data.
#   HWPQ_EXPECT_CEX matches on NAMES, so a name recurring for a different
#   underlying reason still passes -- the two are not distinguished here.
expect_cex_ungated  a_occ_empty_agrees a_no_loss
